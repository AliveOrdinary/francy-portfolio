backend:
  name: git-gateway
  branch: main

media_folder: "/public/images/uploads" # Media will be stored in the repo under this path
public_folder: "/images/uploads" # The src attribute for uploaded media

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Branding", "Photography", "Illustration"], default: "Branding" }
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      - { label: "Featured Video", name: "featuredVideo", widget: "file", required: false }
      - { label: "Featured Video Has Audio?", name: "featuredVideoHasAudio", widget: "boolean", default: false, required: false }
      - { label: "Featured Image (Mobile)", name: "featuredImageMobile", widget: "image", required: false, hint: "Vertical image for mobile devices" }
      - { label: "Featured Video (Mobile)", name: "featuredVideoMobile", widget: "file", required: false, hint: "Vertical video for mobile devices" }
      - { label: "Summary", name: "summary", widget: "markdown", required: false, hint: "Detailed description" }
      - { label: "Year", name: "year", widget: "number" }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Industry", name: "industry", widget: "string", required: false }
      - { label: "Services", name: "services", widget: "select", multiple: true, options: ["Branding", "Web Design", "Print", "Packaging", "UI/UX", "Illustration", "Naming", "Art Direction", "Motion Graphics", "Photography"], required: false, hint: "Not required for Photography/Illustration" }
      - { label: "Studio", name: "studio", widget: "string", required: false, hint: "e.g. Amplifier Studio" }
      - { label: "Studio Link", name: "studioUrl", widget: "string", required: false, hint: "Opens in a new tab" }
      - { label: "Role", name: "role", widget: "string", required: false, hint: "What you did on this project" }
      - label: "Credits"
        name: "credits"
        widget: "list"
        required: false
        hint: "Other contributors, e.g. Grid animation / Name, from my storyboard"
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Value", name: "value", widget: "string" }
      - label: "Gallery Blocks"
        name: "galleryBlocks"
        widget: "list"
        required: false
        hint: "Add media with flexible layouts"
        types:
          - label: "Single Media (Full Width)"
            name: "single"
            fields:
              - { label: "Media Type", name: "mediaType", widget: "select", options: ["image", "video"], default: "image" }
              - { label: "File", name: "file", widget: "file" }
              - { label: "Alt Text", name: "alt", widget: "string", required: false, hint: "Describe the image for screen readers and search" }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Has Audio?", name: "hasAudio", widget: "boolean", default: false, required: false }
              - { label: "Show in scrollable frame?", name: "frame", widget: "boolean", default: false, required: false, hint: "For tall images like a full web page: shown in a browser-style window that scrolls" }
              - { label: "Display Order", name: "order", widget: "number", default: 1 }
          - label: "Seamless Pair (Merged on Desktop)"
            name: "seamlessPair"
            fields:
              - { label: "Left Media Type", name: "leftType", widget: "select", options: ["image", "video"], default: "image" }
              - { label: "Left File", name: "leftFile", widget: "file", hint: "1:1 aspect ratio recommended" }
              - { label: "Left Alt Text", name: "leftAlt", widget: "string", required: false }
              - { label: "Left Has Audio?", name: "leftHasAudio", widget: "boolean", default: false, required: false }
              - { label: "Right Media Type", name: "rightType", widget: "select", options: ["image", "video"], default: "image" }
              - { label: "Right File", name: "rightFile", widget: "file", hint: "1:1 aspect ratio recommended" }
              - { label: "Right Alt Text", name: "rightAlt", widget: "string", required: false }
              - { label: "Right Has Audio?", name: "rightHasAudio", widget: "boolean", default: false, required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Display Order", name: "order", widget: "number", default: 1 }
          - label: "Side by Side (With Gap)"
            name: "sideBySide"
            fields:
              - { label: "Left Media Type", name: "leftType", widget: "select", options: ["image", "video"], default: "image" }
              - { label: "Left File", name: "leftFile", widget: "file" }
              - { label: "Left Alt Text", name: "leftAlt", widget: "string", required: false }
              - { label: "Left Has Audio?", name: "leftHasAudio", widget: "boolean", default: false, required: false }
              - { label: "Right Media Type", name: "rightType", widget: "select", options: ["image", "video"], default: "image" }
              - { label: "Right File", name: "rightFile", widget: "file" }
              - { label: "Right Alt Text", name: "rightAlt", widget: "string", required: false }
              - { label: "Right Has Audio?", name: "rightHasAudio", widget: "boolean", default: false, required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Display Order", name: "order", widget: "number", default: 1 }
          - label: "Text Section"
            name: "text"
            fields:
              - { label: "Label", name: "label", widget: "string", required: false, hint: "Small label, e.g. 01 — The challenge" }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "markdown", required: false, hint: "One to three sentences" }
              - { label: "Display Order", name: "order", widget: "number", default: 1 }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Homepage thumbnail", name: "homeThumbnail", widget: "file", required: false, hint: "Image or video for the homepage tile. Falls back to the featured image/video" }
      - { label: "Homepage thumbnail shape", name: "homeRatio", widget: "select", options: ["1/1", "4/5", "16/9"], required: false, hint: "Square, portrait or wide" }
      - { label: "Homepage tags", name: "homeTags", widget: "list", required: false, hint: "Short tags under the tile. Falls back to Services" }
      - { label: "Order", name: "order", widget: "number", default: 1 }

  - name: "pages"
    label: "Pages"
    files:
      - label: "About Page"
        name: "about"
        file: "content/pages/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "About" }
          - { label: "Bio", name: "bio", widget: "markdown" }
          - { label: "What I do", name: "whatIDo", widget: "list", required: false, hint: "One short line per item" }
          - { label: "Tools", name: "tools", widget: "list", required: false, hint: "One app per item, e.g. Figma" }
          - label: "Experience"
            name: "experience"
            widget: "list"
            required: false
            fields:
              - { label: "Organisation", name: "organisation", widget: "string" }
              - { label: "Link", name: "url", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Years", name: "years", widget: "string", required: false, hint: "e.g. 2024–present" }
              - { label: "Description", name: "description", widget: "string", required: false }
          - label: "Education"
            name: "education"
            widget: "list"
            required: false
            fields:
              - { label: "Qualification", name: "qualification", widget: "string" }
              - { label: "School", name: "school", widget: "string" }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Year", name: "year", widget: "string", required: false }
          - { label: "Profile Image", name: "profileImage", widget: "image" }
          - { label: "Profile Image (Mobile)", name: "profileImageMobile", widget: "image", required: false, hint: "Vertical image optimized for mobile devices" }
          - { label: "Mobile Text Overlay", name: "mobileOverlay", widget: "image", required: false, hint: "SVG or PNG overlay for mobile image (for text animations)" }
      
      - label: "Contact Page"
        name: "contact"
        file: "content/pages/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Contact" }
          - { label: "Intro", name: "intro", widget: "text", required: false }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - label: "Social Media"
            name: "socialMedia"
            widget: "list"
            fields:
              - { label: "Platform", name: "platform", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
      
      - label: "Home Page"
        name: "home"
        file: "content/pages/home.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Home" }
          - { label: "Name", name: "name", widget: "string", hint: "The large name at the top" }
          - { label: "Role", name: "role", widget: "string", required: false, hint: "Small label, e.g. Art director & graphic designer" }
          - { label: "Intro Text", name: "introText", widget: "text" }
          - { label: "Availability", name: "availability", widget: "string", required: false, hint: "Shown with a green dot, e.g. Open to roles. Leave empty to hide" }
          - { label: "Work Heading", name: "featuredProjectsHeading", widget: "string", default: "Selected work" }

  - name: "global"
    label: "Global Settings"
    files:
      - label: "Site Info"
        name: "info"
        file: "content/global/info.md"
        fields:
          - { label: "Site Title", name: "siteTitle", widget: "string" }
          - { label: "Site Description", name: "siteDescription", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - { label: "Location", name: "location", widget: "string", required: false, hint: "Shown in the header, e.g. Toronto, CA" }
          - label: "Header links"
            name: "headerLinks"
            widget: "list"
            required: false
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Short text (phones)", name: "short", widget: "string", required: false }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Navigation"
            name: "navigation"
            widget: "list"
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Footer Text"
            name: "footerText"
            widget: "string" 