backend:
  name: git-gateway
  branch: main

media_folder: "/public/images/uploads" # Media will be stored in the repo under this path
public_folder: "/images/uploads" # The src attribute for uploaded media

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Branding", "Photography", "Illustration"], default: "Branding" }
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      - { label: "Featured Video", name: "featuredVideo", widget: "file", required: false }
      - { label: "Featured Video Has Audio?", name: "featuredVideoHasAudio", widget: "boolean", default: false, required: false }
      - { label: "Featured Image (Mobile)", name: "featuredImageMobile", widget: "image", required: false, hint: "Vertical image for mobile devices" }
      - { label: "Featured Video (Mobile)", name: "featuredVideoMobile", widget: "file", required: false, hint: "Vertical video for mobile devices" }
      - { label: "Summary", name: "summary", widget: "markdown", required: false, hint: "Detailed description" }
      - { label: "Year", name: "year", widget: "number" }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Industry", name: "industry", widget: "string", required: false }
      - { label: "Services", name: "services", widget: "select", multiple: true, options: ["Branding", "Web Design", "Print", "Packaging", "UI/UX", "Illustration", "Naming", "Art Direction", "Motion Graphics", "Photography"], required: false, hint: "Not required for Photography/Illustration" }
      - label: "Gallery Blocks"
        name: "galleryBlocks"
        widget: "list"
        required: false
        hint: "Add media with flexible layouts"
        types:
          - label: "Single Media (Full Width)"
            name: "single"
            fields:
              - { label: "Media Type", name: "mediaType", widget: "select", options: ["image", "video"], default: "image" }
              - { label: "File", name: "file", widget: "file" }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Has Audio?", name: "hasAudio", widget: "boolean", default: false, required: false }
              - { label: "Display Order", name: "order", widget: "number", default: 1 }
          - label: "Seamless Pair (Merged on Desktop)"
            name: "seamlessPair"
            fields:
              - { label: "Left Media Type", name: "leftType", widget: "select", options: ["image", "video"], default: "image" }
              - { label: "Left File", name: "leftFile", widget: "file", hint: "1:1 aspect ratio recommended" }
              - { label: "Left Has Audio?", name: "leftHasAudio", widget: "boolean", default: false, required: false }
              - { label: "Right Media Type", name: "rightType", widget: "select", options: ["image", "video"], default: "image" }
              - { label: "Right File", name: "rightFile", widget: "file", hint: "1:1 aspect ratio recommended" }
              - { label: "Right Has Audio?", name: "rightHasAudio", widget: "boolean", default: false, required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Display Order", name: "order", widget: "number", default: 1 }
          - label: "Side by Side (With Gap)"
            name: "sideBySide"
            fields:
              - { label: "Left Media Type", name: "leftType", widget: "select", options: ["image", "video"], default: "image" }
              - { label: "Left File", name: "leftFile", widget: "file" }
              - { label: "Left Has Audio?", name: "leftHasAudio", widget: "boolean", default: false, required: false }
              - { label: "Right Media Type", name: "rightType", widget: "select", options: ["image", "video"], default: "image" }
              - { label: "Right File", name: "rightFile", widget: "file" }
              - { label: "Right Has Audio?", name: "rightHasAudio", widget: "boolean", default: false, required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Display Order", name: "order", widget: "number", default: 1 }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Order", name: "order", widget: "number", default: 1 }

  - name: "pages"
    label: "Pages"
    files:
      - label: "About Page"
        name: "about"
        file: "content/pages/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "About" }
          - { label: "Bio", name: "bio", widget: "markdown" }
          - { label: "Profile Image", name: "profileImage", widget: "image" }
          - { label: "Profile Image (Mobile)", name: "profileImageMobile", widget: "image", required: false, hint: "Vertical image optimized for mobile devices" }
          - { label: "Mobile Text Overlay", name: "mobileOverlay", widget: "image", required: false, hint: "SVG or PNG overlay for mobile image (for text animations)" }
      
      - label: "Contact Page"
        name: "contact"
        file: "content/pages/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Contact" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - label: "Social Media"
            name: "socialMedia"
            widget: "list"
            fields:
              - { label: "Platform", name: "platform", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
      
      - label: "Home Page"
        name: "home"
        file: "content/pages/home.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Home" }
          - { label: "Intro Text", name: "introText", widget: "string" }
          - { label: "Featured Projects Heading", name: "featuredProjectsHeading", widget: "string", default: "Featured Projects" }

  - name: "global"
    label: "Global Settings"
    files:
      - label: "Site Info"
        name: "info"
        file: "content/global/info.md"
        fields:
          - { label: "Site Title", name: "siteTitle", widget: "string" }
          - { label: "Site Description", name: "siteDescription", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - label: "Navigation"
            name: "navigation"
            widget: "list"
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Footer Text"
            name: "footerText"
            widget: "string" 